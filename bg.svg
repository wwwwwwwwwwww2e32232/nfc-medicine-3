<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset=".45" stop-color="#e3eaf2"/>
      <stop offset="1" stop-color="#d6e0ec"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#8fabcf" stop-opacity=".0"/>
      <stop offset=".35" stop-color="#8fabcf" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a9c3dd" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="ice" x1="1" y1="0" x2="0" y2=".6">
      <stop offset="0" stop-color="#a7cfdf" stop-opacity=".8"/>
      <stop offset=".6" stop-color="#bcdbe6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#bcdbe6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b3bcd8" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#c7cee3" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c7cee3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="silk" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="line" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1000" height="1600" fill="url(#base)"/>

  <!-- 멀리 있는 큰 물결 -->
  <path filter="url(#soft)" fill="url(#steel)" d="M-200 260 C 120 120, 360 420, 640 300 S 1080 120, 1240 260 L 1240 620 C 980 520, 760 700, 480 640 S -40 520, -200 640 Z"/>
  <path filter="url(#soft)" fill="url(#ice)" d="M-200 820 C 160 700, 420 980, 720 860 S 1100 700, 1240 820 L 1240 1180 C 1000 1100, 760 1260, 460 1180 S 20 1060, -200 1160 Z"/>
  <path filter="url(#soft)" fill="url(#slate)" d="M-200 1300 C 200 1180, 480 1440, 780 1320 S 1120 1200, 1240 1300 L 1240 1800 L -200 1800 Z"/>

  <!-- 가까운 실크 주름 -->
  <path filter="url(#silk)" fill="#9fb9d8" fill-opacity=".38" d="M-100 520 C 220 420, 420 640, 700 560 S 1060 420, 1150 500 L 1150 560 C 1000 520, 820 660, 640 650 S 160 520, -100 600 Z"/>
  <path filter="url(#silk)" fill="#b4d4e2" fill-opacity=".45" d="M-100 1040 C 260 940, 520 1160, 800 1060 S 1080 960, 1150 1010 L 1150 1080 C 960 1060, 820 1180, 600 1170 S 140 1060, -100 1120 Z"/>

  <!-- 빛이 스치는 하이라이트 -->
  <path filter="url(#line)" fill="none" stroke="url(#sheen)" stroke-width="10" stroke-linecap="round" d="M-60 470 C 240 370, 440 590, 720 510 S 1040 380, 1100 430"/>
  <path filter="url(#line)" fill="none" stroke="url(#sheen)" stroke-width="8" stroke-linecap="round" d="M-60 990 C 280 890, 540 1100, 820 1010 S 1060 920, 1100 950"/>
  <path filter="url(#line)" fill="none" stroke="url(#sheen)" stroke-width="6" stroke-opacity=".7" stroke-linecap="round" d="M-60 1360 C 260 1260, 520 1480, 820 1380 S 1060 1300, 1100 1330"/>
</svg>
