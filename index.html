<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6ecf3">
<title>폐의약품 바로 버리기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230fa08f'/%3E%3Crect x='7' y='12' width='18' height='8' rx='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<style>
  /* --- 히어로 --- */
  .hero { display: grid; grid-template-columns: 1fr 112px; align-items: center; gap: 6px; }
  .hero .illu-wrap { width: 112px; height: 112px; margin: -12px -6px -12px 0; animation: float 6s ease-in-out infinite; }
  .hero .illu-wrap .illu { width: 100%; height: 100%; }
  @keyframes float { 50% { transform: translateY(-6px) rotate(-2deg); } }
  .hero h2 { margin: 10px 0 2px !important; font-size: 26px !important; line-height: 1.2; letter-spacing: -0.04em !important; display: block !important; }
  .hero h2 .dose { font-size: 17px; font-weight: 650; color: var(--ink-2); letter-spacing: -0.02em; margin-left: 4px; }
  .home-hero { display: grid; grid-template-columns: 1fr; text-align: left; }
  .home-hero .illu { width: 100%; height: auto; max-height: 172px; margin: -14px 0 2px; }
  .home-hero b { font-size: 21px; letter-spacing: -0.035em; display: block; }
  .home-hero p { margin: 4px 0 0; color: var(--ink-2); font-size: 14.5px; }
  .tap-ph { animation: tap 3.2s var(--ease) infinite; transform-origin: 150px 40px; }
  .tap-wave { opacity: 0; animation: wave 3.2s ease-out infinite; }
  @keyframes tap { 0%, 100% { transform: translate(14px, -16px); } 40%, 62% { transform: translate(0, 0); } }
  @keyframes wave { 0%, 38% { opacity: 0; } 48% { opacity: 1; } 70%, 100% { opacity: 0; } }
  .os { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .os div { padding: 10px 12px; border-radius: 16px; background: rgba(255,255,255,.55); border: 1px solid #fff; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
  .os b { display: block; font-size: 13px; color: var(--ink); }
  .hero .co { color: var(--ink-2); font-size: 13.5px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pills span { height: 24px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.7); border: 1px solid #fff; color: var(--ink-2); }
  .pills span.k { color: #fff; border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 75%, #fff), var(--accent)); box-shadow: 0 4px 12px -4px var(--accent); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
  .tiles div { padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.85); box-shadow: 0 1px 0 #fff inset; }
  .tiles small { display: flex; align-items: center; gap: 5px; color: var(--ink-3); font-size: 12px; font-weight: 650; margin-bottom: 3px; }
  .tiles b { font-size: 14px; font-weight: 640; line-height: 1.45; display: block; }
  .lead { font-size: 15.5px; color: var(--ink); line-height: 1.7; }
  .warnlist { margin: 0; padding: 0; list-style: none; }
  .warnlist li { position: relative; padding: 10px 0 10px 22px; border-top: 1px solid var(--hair); font-size: 15px; }
  .warnlist li:first-child { border-top: 0; padding-top: 2px; }
  .warnlist li::before { content: ""; position: absolute; left: 4px; top: 19px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(245,165,36,.18); }
  .warnlist li:first-child::before { top: 11px; }
  .tip { display: flex; gap: 12px; margin-top: 16px; padding: 14px; border-radius: 20px; background: color-mix(in srgb, var(--accent) 10%, rgba(255,255,255,.6)); border: 1px solid rgba(255,255,255,.85); }
  .tip b { display: block; font-size: 14px; color: var(--accent-2); margin-bottom: 2px; }
  .tip p { margin: 0; font-size: 14.5px; }
  .src { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink-3); margin: 16px 4px 0; line-height: 1.55; }
  .src a { color: var(--ink-2); }
  /* --- 배출 --- */
  .mine-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .mine-head .illu { width: 56px; height: 56px; flex: none; }
  .mine-head small { display: block; color: var(--accent-2); font-weight: 700; font-size: 12.5px; }
  .mine-head b { font-size: 19px; letter-spacing: -0.03em; }
  .where { display: flex; gap: 10px; align-items: flex-start; margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: rgba(255,255,255,.6); border: 1px solid #fff; font-size: 14.5px; }
  .where .ico { color: var(--accent-2); margin-top: 2px; }
  .dmini { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hair); }
  .dmini:first-of-type { border-top: 0; padding-top: 0; }
  .dmini .illu { width: 44px; height: 44px; flex: none; }
  .dmini b { font-size: 15.5px; } .dmini p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .facts div { padding: 14px 8px 12px; border-radius: 20px; text-align: center; background: rgba(255,255,255,.55); border: 1px solid #fff; font-size: 12px; color: var(--ink-2); line-height: 1.4; }
  .facts b { display: block; font-size: 25px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 4px;
    background: linear-gradient(180deg, #ff7a7f, #c81e26); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* --- 퀴즈 --- */
  .quiz { padding: 14px; margin-top: 10px; border-radius: 22px; background: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.85); transition: all .35s var(--ease); }
  .quiz:first-child { margin-top: 0; }
  .quiz .qq { font-weight: 650; font-size: 15px; letter-spacing: -0.02em; }
  .quiz .qq small { color: var(--accent-2); font-weight: 800; margin-right: 4px; }
  .quiz .ox { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .quiz .ox button { height: 52px; border-radius: 999px; border: 1px solid rgba(15,23,42,.1); cursor: pointer; font: inherit; font-size: 22px; font-weight: 800; color: var(--ink-2);
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.6)); box-shadow: 0 1px 0 #fff inset, 0 8px 18px -12px rgba(20,30,50,.4); transition: all .25s var(--ease); }
  .quiz .ox button:active { transform: scale(.96); }
  .quiz .ox button:disabled { cursor: default; opacity: .55; }
  .quiz .ox button.pick { opacity: 1; color: #fff; border-color: transparent; }
  .quiz.ok { background: rgba(225,248,238,.7); } .quiz.no { background: rgba(255,236,236,.72); }
  .quiz.ok .ox button.pick { background: linear-gradient(180deg, #4fd1a5, #12a574); box-shadow: 0 10px 22px -10px #12a574; }
  .quiz.no .ox button.pick { color: #d1343a; background: rgba(255,228,228,.95); border: 2px solid rgba(229,72,77,.45); box-shadow: none; }
  .quiz .exp { margin-top: 10px; font-size: 14px; display: flex; gap: 8px; animation: fadeIn .4s ease both; }
  .quiz.just.ok .ox button.pick { animation: pop .5s cubic-bezier(.34,1.56,.64,1), okRing .7s ease-out; }
  .quiz.just.no .ox button.pick { animation: shake .45s ease; }
  .quiz.no .ox button.right { opacity: 1; color: #fff; border-color: transparent; background: linear-gradient(180deg, #4fd1a5, #12a574); box-shadow: 0 10px 22px -10px #12a574; }
  .quiz.just.no .ox button.right { animation: pop .5s cubic-bezier(.34,1.56,.64,1) .25s both; }
  .quiz .exp b { font-size: 15px; }
  .quiz.just.ok { animation: okFlash .8s ease; }
  @keyframes okRing { 0% { box-shadow: 0 0 0 0 rgba(18,165,116,.5); } 100% { box-shadow: 0 0 0 16px rgba(18,165,116,0); } }
  @keyframes okFlash { 0% { background: rgba(190,242,220,.95); } 100% { background: rgba(225,248,238,.7); } }
  .score b { display: inline-block; animation: pop .55s cubic-bezier(.34,1.56,.64,1) both; }
  .hero .illu-wrap .illu { animation: popSoft .7s cubic-bezier(.34,1.4,.64,1) both; }
  .mine-head .illu, .dmini .illu { animation: popSoft .6s cubic-bezier(.34,1.4,.64,1) both .1s; }
  .tfade { animation: fadeIn .45s ease both; }
  .quiz.ok .exp .ico { color: #12a574; } .quiz.no .exp .ico { color: var(--danger); }
  .score { margin-top: 14px; text-align: center; font-weight: 750; letter-spacing: -0.02em; }
  .score b { font-size: 22px; color: var(--accent-2); }
  /* --- 설문 / 완료 --- */
  .cnt { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-3); font-weight: 650; margin-bottom: 8px; }
  .cert { text-align: center; padding: 10px 6px 4px; }
  .cert svg.ring { width: 96px; height: 96px; }
  .cert .ring circle { fill: none; stroke: var(--brand); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 280; stroke-dashoffset: 280; animation: draw 1s var(--ease) .1s forwards; transform: rotate(-90deg); transform-origin: center; }
  .cert .ring path { fill: none; stroke: var(--brand); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s var(--ease) .85s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .cert h2 { justify-content: center; margin: 12px 0 4px !important; font-size: 22px !important; }
  /* --- 홈 --- */
  .how3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .how3 div { padding: 14px 8px; border-radius: 20px; text-align: center; background: rgba(255,255,255,.55); border: 1px solid #fff; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .how3 .ic-tile { margin: 0 auto 8px; }
</style>
<link rel="stylesheet" href="glass.css">
</head>
<body>
<header class="top">
  <div class="small" id="badges"></div>
  <h1 id="title">폐의약품 바로 버리기</h1>
  <p id="sub">남은 약, 어떻게 버려야 할까요?</p>
</header>

<div class="wrap">
  <div class="stepper" id="stepper" style="display:none">
    <span class="knob"></span>
    <div class="st"><i>1</i>약품 정보</div>
    <div class="st"><i>2</i>버리는 방법</div>
    <div class="st"><i>3</i>설문</div>
  </div>
  <div id="main"></div>
  <footer>벗, 돋움 프로젝트 · 폐의약품 NFC 안내 시스템<br><a href="./">처음으로</a></footer>
</div>
<div class="dock"><div class="in" id="dock"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="icons.js"></script>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script src="glass.js"></script>
<script>
(async function () {
  const P = new URLSearchParams(location.search);
  const tag = (P.get("t") || "").trim();
  const sParam = (P.get("s") || "").trim().toLowerCase();
  const $ = id => document.getElementById(id);
  const esc = App.esc;
  const root = document.documentElement;
  const TITLE = App.CFG.TITLE || "폐의약품 바로 버리기";
  document.title = TITLE;

  // ---- 접속 경로(NFC/QR) 판별 + 방문 기록 ----
  let src = sessionStorage.getItem("nfcmed_src");
  let shouldLog = false;
  if (sParam) { src = sParam; shouldLog = true; }
  else if (!src) { src = "direct"; shouldLog = true; }
  sessionStorage.setItem("nfcmed_src", src);
  if (sParam) { // 새로고침·공유 시 중복 기록 방지
    P.delete("s");
    history.replaceState(null, "", location.pathname + (P.toString() ? "?" + P : ""));
  }
  if (shouldLog) App.post({ action: "visit", tag: tag || "home", src, vid: App.visitorId(), device: App.device() }).catch(() => {});

  const b = [];
  if (src === "nfc") b.push('<span class="badge nfc">' + I("nfc", 15, 2) + "NFC로 접속</span>");
  else if (src === "qr") b.push('<span class="badge qr">' + I("qr", 14, 2) + "QR로 접속</span>");
  if (App.DEMO) b.push('<span class="badge demo"><span class="dot"></span>데모 모드</span>');
  $("badges").innerHTML = b.join("");

  // ---- 태그 → 약품 ----
  let medId = null, place = "";
  if (tag) {
    if (CONTENT[tag]) medId = tag;
    else {
      $("main").innerHTML = '<div class="card center muted">불러오는 중…</div>';
      try {
        const f = (await App.getTags()).find(x => String(x.id) === tag);
        if (f && CONTENT[f.type]) { medId = f.type; place = f.name; }
      } catch (e) {}
    }
  }
  const med = medId ? CONTENT[medId] : null;
  const dtype = med ? DISPOSAL[med.disposal] : null;

  // ---- 테마 (약마다 색과 배경 오로라가 바뀜) ----
  function theme(m) {
    const a = m ? m.aura : ["#5fdcc6", "#8fb7ff", "#ffc98f"];
    root.style.setProperty("--accent", m ? m.color : "#12a594");
    root.style.setProperty("--accent-2", m ? m.accent2 : "#0b7d70");
    root.style.setProperty("--c1", a[0]); root.style.setProperty("--c2", a[1]); root.style.setProperty("--c3", a[2]);
  }
  theme(med);

  function setHeader(title, sub) {
    [["title", title], ["sub", sub]].forEach(([id, v]) => { const el = $(id); el.textContent = v; el.classList.remove("tfade"); void el.offsetWidth; el.classList.add("tfade"); });
  }
  function setStep(n) {
    const st = $("stepper"); st.style.display = "";
    st.style.setProperty("--i", n - 1);
    st.querySelectorAll(".st").forEach((d, i) => {
      d.className = "st" + (i + 1 === n ? " on" : i + 1 < n ? " done" : "");
      d.querySelector("i").textContent = i + 1 < n ? "✓" : i + 1;
    });
    window.scrollTo(0, 0);
  }
  function dock(html, binds) {
    $("dock").innerHTML = html;
    Object.keys(binds || {}).forEach(id => { const el = $(id); if (el) el.onclick = binds[id]; });
  }
  const nameHtml = n => { const m = n.match(/^(.*?)\s(\d.*)$/); return m ? esc(m[1]) + '<span class="dose">' + esc(m[2]) + "</span>" : esc(n); };
  const tile = (icon, cls) => '<span class="ic-tile' + (cls ? " " + cls : "") + '">' + I(icon, 18, 2) + "</span>";
  const card = (icon, title, body, cls) => '<div class="card fade"><h2>' + tile(icon, cls) + title + "</h2>" + body + "</div>";
  const nextBtn = (id, label) => '<button class="btn" id="' + id + '">' + label + I("arrowR", 18, 2.2) + "</button>";
  const backBtn = id => '<button class="btn ghost round" id="' + id + '" aria-label="이전">' + I("chevL", 20, 2.2) + "</button>";

  // ① 약품 정보
  function step1() {
    setStep(1);
    setHeader("이 약, 알고 쓰세요", (place ? place + " · " : "") + "성분과 주의사항부터 확인해요");
    const useLabel = med.disposal === "ointment" ? "바르는 법" : "먹는 법";
    $("main").innerHTML =
      '<div class="card fade"><div class="hero"><div><div class="pills"><span class="k">' + esc(med.type) + "</span><span>" + esc((med.summary.split("·")[1] || "").trim()) + "</span></div>" +
      "<h2>" + nameHtml(med.name) + '</h2><div class="co">' + esc(med.company) + '<br><span style="color:var(--ink-3)">' + esc(med.kind) + "</span></div></div>" +
      '<div class="illu-wrap">' + ILLU[med.disposal] + "</div></div>" +
      '<div class="tiles"><div><small>' + I("flask", 13, 2) + "주성분</small><b>" + esc(med.ingredient) + "</b></div>" +
      "<div><small>" + I("box", 13, 2) + "모양</small><b>" + esc(med.form) + "</b></div>" +
      "<div><small>" + I("shield", 13, 2) + "보관</small><b>" + esc(med.storage.split(".")[0]) + "</b></div>" +
      "<div><small>" + I("clock", 13, 2) + "사용기한</small><b>" + esc(med.expiry) + "</b></div></div></div>" +
      card("spark", "이럴 때 써요", '<div class="lead">' + esc(med.effect) + "</div>") +
      card("hand", useLabel, '<div class="lead">' + esc(med.usage) + "</div>") +
      card("alert", "주의할 점", '<ul class="warnlist">' + med.cautions.map(c => "<li>" + esc(c) + "</li>").join("") + "</ul>", "amber") +
      card("trash", "이럴 땐 버려요", '<ul class="check">' + DISCARD_WHEN.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
        '<div class="tip">' + tile("leaf") + "<div><b>이 약을 버릴 때는</b><p>" + esc(med.disposalTip) + "</p></div></div>") +
      '<div class="src">' + I("book", 14, 1.8) + '<span>출처: <a href="' + esc(med.source) + '" target="_blank" rel="noopener">약학정보원 의약품 상세정보</a>, 식약처 허가사항을 학생 탐구용으로 요약. 실제 사용 전에는 제품 설명서와 약사 안내를 따르세요.</span></div>';
    dock(nextBtn("dNext", "올바르게 버리는 방법"), { dNext: step2 });
  }

  // ② 통합 배출 안내 + OX 퀴즈
  const quiz = JSON.parse(sessionStorage.getItem("nfcmed_quiz") || "{}");
  let lastQ = -1;
  function quizHtml() {
    const done = Object.keys(quiz).length, right = Object.values(quiz).filter(Boolean).length;
    return QUIZ.map((x, i) => {
      const has = i in quiz, cls = has ? (quiz[i] ? " ok" : " no") + (i === lastQ ? " just" : "") : "";
      const picked = has ? (quiz[i] ? x.a : !x.a) : null;
      return '<div class="quiz' + cls + '"><div class="qq"><small>Q' + (i + 1) + "</small>" + esc(x.q) + '</div><div class="ox">' +
        '<button data-q="' + i + '" data-v="1"' + (has ? " disabled" : "") + (picked === true ? ' class="pick"' : has && x.a ? ' class="right"' : "") + ' aria-label="O">O</button>' +
        '<button data-q="' + i + '" data-v="0"' + (has ? " disabled" : "") + (picked === false ? ' class="pick"' : has && !x.a ? ' class="right"' : "") + ' aria-label="X">X</button></div>' +
        (has ? '<div class="exp">' + I(quiz[i] ? "check" : "x", 18, 2.4) + "<span><b>" + (quiz[i] ? "정답!" : "정답은 " + (x.a ? "O" : "X")) + "</b> " + esc(x.exp) + "</span></div>" : "") + "</div>";
    }).join("") + (done === QUIZ.length ? '<div class="score"><b>' + right + " / " + QUIZ.length + "</b> &nbsp;" + (right === QUIZ.length ? "완벽해요!" : "잘했어요!") + "</div>" : "");
  }
  function step2() {
    setStep(2);
    setHeader("올바르게 버리는 방법", med ? med.name + "은(는) " + med.type + " 방법으로 버려요" : "약 종류별로 버리는 방법이 달라요");
    const others = Object.keys(DISPOSAL).filter(k => !med || k !== med.disposal);
    const mine = med ? '<div class="card fade"><div class="mine-head">' + ILLU[med.disposal] + "<div><small>" + esc(med.name) + "</small><b>" + esc(med.type) + "은 이렇게 버려요</b></div></div>" +
      '<ol class="steps">' + dtype.how.map(h => "<li>" + esc(h) + "</li>").join("") + "<li>" + esc(med.disposalTip) + "</li></ol>" +
      '<div class="where">' + I("pin", 18, 2) + "<span>" + esc(dtype.where) + "</span></div></div>" : "";
    $("main").innerHTML = mine +
      card("box", med ? "다른 약은 이렇게" : "약 종류별 배출 방법", others.map(k => { const d = DISPOSAL[k]; return '<div class="dmini">' + ILLU[k] + "<div><b>" + esc(d.name) + "</b><p>" + d.how.map(esc).join(" ") + '</p><p style="color:var(--accent-2);font-weight:600">' + esc(d.where) + "</p></div></div>"; }).join("")) +
      card("brain", "OX 퀴즈", '<div id="quiz">' + quizHtml() + "</div>") +
      card("chart", "알고 있었나요?", '<div class="facts">' + FACTS.map(f => '<div><b data-n="' + f.n + '">0</b>' + esc(f.t) + "</div>").join("") +
        '</div><p class="muted" style="margin:10px 2px 0;font-size:12px">시민 823명 조사 · 자원순환사회연대, 정책주간지 K-공감(2024)</p>') +
      card("x", "이렇게 버리면 안 돼요", '<ul class="dont"><li>변기·싱크대·하수구에 버리기</li><li>일반 쓰레기(종량제 봉투)에 버리기</li><li>물약을 우체통에 넣기</li></ul>' +
        '<h3>잘못 버리면 생기는 일</h3><ul class="info">' + IMPACT.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>", "red");
    $("quiz").onclick = e => {
      const bt = e.target.closest("button[data-q]"); if (!bt) return;
      const i = +bt.dataset.q; if (i in quiz) return;
      quiz[i] = (bt.dataset.v === "1") === QUIZ[i].a;
      sessionStorage.setItem("nfcmed_quiz", JSON.stringify(quiz));
      lastQ = i;
      $("quiz").innerHTML = quizHtml();
      if (navigator.vibrate) navigator.vibrate(quiz[i] ? 18 : [30, 40, 30]);
    };
    countUp();
    dock((med ? backBtn("dPrev") : "") + nextBtn("dNext", "1분 설문하기"), { dPrev: step1, dNext: step3 });
  }

  // ③ 내장 설문
  const doneKey = "nfcmed_surveyed";
  function step3() {
    setStep(3);
    setHeader("1분 설문", "익명이에요. 이름은 받지 않아요.");
    if (localStorage.getItem(doneKey)) return renderDone(true);
    const need = SURVEY.filter(s => !s.text).length;
    $("main").innerHTML = '<div class="card fade"><div class="cnt"><span>진행</span><span id="cntTxt">0 / ' + need + '</span></div><div class="progress"><div id="prog"></div></div>' +
      '<form id="sf">' + SURVEY.map((s, i) => {
        if (s.text) return '<div class="q"><div class="qt">' + esc(s.q) + '</div><textarea name="' + s.key + '" rows="3" maxlength="300" placeholder="자유롭게 적어 주세요 (이름은 쓰지 마세요)"></textarea></div>';
        return '<div class="q" id="q_' + s.key + '"><div class="qt"><span class="n">' + (i + 1) + "</span>" + esc(s.q) + '</div><div class="opts">' +
          s.opts.map(o => '<label><input type="radio" name="' + s.key + '" value="' + esc(o) + '">' + esc(o) + "</label>").join("") + "</div></div>";
      }).join("") + "</form></div>";
    const form = $("sf");
    form.onchange = () => {
      const n = SURVEY.filter(s => !s.text && form.querySelector('input[name="' + s.key + '"]:checked')).length;
      $("cntTxt").textContent = n + " / " + need; $("prog").style.width = (n / need * 100) + "%";
    };
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form), answers = {};
      for (const s of SURVEY) {
        const v = (fd.get(s.key) || "").toString().trim();
        if (!s.text && !v) { toast("아직 답하지 않은 문항이 있어요"); $("q_" + s.key).scrollIntoView({ block: "center", behavior: "smooth" }); return; }
        answers[s.key] = v;
      }
      const qd = Object.keys(quiz).length;
      answers.quiz = qd ? Object.values(quiz).filter(Boolean).length + "/" + qd : "";
      const bt = $("dSend"); bt.disabled = true; bt.textContent = "보내는 중…";
      try {
        await App.post({ action: "survey", tag: tag || "home", src, vid: App.visitorId(), answers });
        localStorage.setItem(doneKey, "1");
        renderDone(false);
      } catch (err) {
        bt.disabled = false; bt.textContent = "제출하기";
        toast("전송에 실패했어요. 인터넷 연결을 확인해 주세요.");
      }
    };
    dock(backBtn("dPrev") + '<button class="btn" id="dSend">제출하기</button>', {
      dPrev: step2, dSend: () => form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true })),
    });
  }
  function renderDone(already) {
    const st = $("stepper"); st.querySelectorAll(".st")[2].className = "st done"; st.querySelectorAll(".st i")[2].textContent = "✓";
    window.scrollTo(0, 0);
    if (!already) confetti();
    setHeader(already ? "이미 참여했어요" : "고마워요!", "오늘부터 남은 약은 올바르게 버려요");
    $("main").innerHTML = '<div class="card fade"><div class="cert"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M32 51l12 12 24-26"/></svg>' +
      "<h2>" + (already ? "설문에 이미 참여했어요" : "설문 완료") + '</h2><p class="muted" style="margin:0">작은 실천이 강과 바다를 지켜요</p></div>' +
      '<h3>꼭 기억해요</h3><ul class="check"><li>알약은 알맹이만, 가루약은 봉지째</li><li>물약은 한 병에 모아 수거함으로 (우체통 ✕)</li><li>연고·안약은 짜지 말고 용기째</li></ul></div>' +
      card("spark", "다른 약도 알아보기", '<div class="typegrid">' + Object.keys(CONTENT).filter(k => k !== medId).map(medCard).join("") + "</div>");
    dock('<a class="btn" href="./">처음으로</a>');
  }
  function medCard(k) {
    const c = CONTENT[k];
    return '<a class="typecard" href="?t=' + k + '"><span class="ic">' + ILLU[c.disposal] + '</span><span><b>' + esc(c.name) + "</b><small>" + esc(c.summary) + '</small></span><span class="arr">' + I("chevR", 18, 2) + "</span></a>";
  }

  // 첫 화면
  function home() {
    setHeader(TITLE, "약 정보부터 올바른 배출까지, 폰을 대면 한 번에");
    document.querySelector("footer a").style.display = "none";
    $("main").innerHTML = '<div class="card fade home-hero">' + ILLU.tap + "<b>약 상자에 폰을 대 보세요</b><p>앱 설치 없이 약 정보 → 버리는 법 → 1분 설문이 차례로 열려요.</p>" +
      '<div class="os"><div><b>iPhone</b>화면을 켜고 윗부분을 대면 뜨는 알림을 터치</div><div><b>Android</b>NFC를 켜고 뒷면을 대면 바로 열려요</div></div></div>' +
      card("box", "또는 직접 고르기", '<div class="typegrid">' + Object.keys(CONTENT).map(medCard).join("") + "</div>");
    dock('<button class="btn ghost" id="dGuide" style="flex:1">종류별 버리는 법</button><button class="btn" id="dSurvey">설문 참여</button>', { dGuide: step2, dSurvey: step3 });
  }

  if (tag && !med) {
    setHeader("등록되지 않은 태그", "관리자 페이지에서 먼저 등록해 주세요");
    $("main").innerHTML = card("info", "태그 ID: " + esc(tag), '<p class="muted" style="margin:0">스티커에 저장된 주소의 t= 뒤 값이 등록 목록에 없어요.</p>');
    dock('<a class="btn" href="./">처음으로</a>');
  } else if (med) step1();
  else home();

  // 숫자가 0부터 올라가는 카운트 (글자 위치는 고정)
  function countUp() {
    const els = document.querySelectorAll(".facts b[data-n]");
    const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); io.unobserve(e.target); } }), { threshold: .4 }) : null;
    els.forEach(el => io ? io.observe(el) : run(el));
    function run(el) {
      const raw = el.dataset.n, m = raw.match(/^([\d.]+)(.*)$/); if (!m) { el.textContent = raw; return; }
      const end = parseFloat(m[1]), dec = (m[1].split(".")[1] || "").length, t0 = performance.now(), dur = 1100;
      (function tick(t) {
        const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = (end * e).toFixed(dec) + m[2];
        if (p < 1) requestAnimationFrame(tick);
      })(t0);
    }
  }
  // 설문 완료 축하 종이가루
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.createElement("div"); box.className = "confetti";
    const colors = ["#0fa08f", "#3e63dd", "#e5484d", "#f5a524", "#8e4ec6", "#5fdcc6"];
    for (let k = 0; k < 46; k++) {
      const i = document.createElement("i");
      i.style.left = Math.random() * 100 + "%";
      i.style.background = colors[k % colors.length];
      i.style.setProperty("--x", (Math.random() * 160 - 80) + "px");
      i.style.setProperty("--r", (Math.random() * 900 - 450) + "deg");
      i.style.setProperty("--d", (1.8 + Math.random() * 1.6) + "s");
      i.style.animationDelay = Math.random() * .35 + "s";
      if (k % 3 === 0) { i.style.width = "9px"; i.style.height = "9px"; i.style.borderRadius = "50%"; }
      box.appendChild(i);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 4000);
  }

  function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2200); }
})();
</script>
</body>
</html>
